name: upstream-sync

# Tracks NousResearch/hermes-agent and keeps the fork's `main` mirror current.
# Probes whether the Railway patches on `railway` still rebase cleanly and opens
# a tracking issue with ship instructions. It never deploys — deploying stays a
# deliberate `railway up` step (see the issue body).

on:
  schedule:
    - cron: '0 9 * * *'   # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout railway (full history)
        uses: actions/checkout@v4
        with:
          ref: railway
          fetch-depth: 0

      - name: Sync from upstream and report
        env:
          # Fine-grained PAT (Issues: read/write on this repo only). The built-in
          # GITHUB_TOKEN is capped read-only by the account-level Actions default,
          # which has no API/repo override, so issue creation needs this PAT.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: bash .github/scripts/upstream-sync.sh
